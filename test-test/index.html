<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手机</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#111;font-family:system-ui,sans-serif}
.phone{width:390px;height:844px;background:#0b1220;border-radius:40px;overflow:hidden;color:#fff;display:flex;flex-direction:column;box-shadow:0 20px 60px #0008;border:8px solid #1c1c1e;position:relative}
.bar{display:flex;justify-content:space-between;padding:14px 22px 6px;font-size:13px;z-index:2}
.screen{flex:1;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}
.home{padding:28px 20px;background:linear-gradient(180deg,#1a2a4a,#0b1220)}
h1{font-size:32px;font-weight:600}
.sub{opacity:.7;margin:6px 0 28px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center;font-size:12px}
.app,.dock .icon{cursor:pointer}
.app{display:grid;gap:6px;justify-items:center}
.icon{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:24px}
.dock{margin:auto 12px 16px;background:#ffffff22;border-radius:24px;display:flex;justify-content:space-around;padding:12px}
.msgs{background:#0b1220}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;font-size:20px;font-weight:600}
.back{background:0;border:0;color:#0a84ff;font-size:28px;cursor:pointer;line-height:1}
.list{overflow:auto;flex:1}
.row{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #ffffff12;cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.meta{flex:1;min-width:0}
.name{display:flex;justify-content:space-between;margin-bottom:4px}
.name b{font-weight:600}
.time{opacity:.45;font-size:12px}
.preview{opacity:.55;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><span>9:41</span><span>5G ▮▮▮</span></div>
  <div id="home" class="screen home on">
    <h1>早上好</h1>
    <p class="sub">星期二 · 10月13日</p>
    <div class="apps">
      <div class="app" onclick="go('msgs')"><div class="icon" style="background:#34c759">💬</div>信息</div>
      <div class="app"><div class="icon" style="background:#007aff">📞</div>电话</div>
      <div class="app"><div class="icon" style="background:#ff9500">📷</div>相机</div>
      <div class="app"><div class="icon" style="background:#5856d6">🗺️</div>地图</div>
      <div class="app"><div class="icon" style="background:#ff2d55">🎵</div>音乐</div>
      <div class="app"><div class="icon" style="background:#30b0c7">🌤️</div>天气</div>
      <div class="app"><div class="icon" style="background:#af52de">📅</div>日历</div>
      <div class="app"><div class="icon" style="background:#8e8e93">⚙️</div>设置</div>
    </div>
    <div class="dock">
      <div class="icon" style="background:#34c759" onclick="go('msgs')">💬</div>
      <div class="icon" style="background:#007aff">🌐</div>
      <div class="icon" style="background:#ff3b30">✉️</div>
      <div class="icon" style="background:#32ade6">📷</div>
    </div>
  </div>
  <div id="msgs" class="screen msgs">
    <div class="top"><button class="back" onclick="go('home')">‹</button>信息</div>
    <div class="list">
      <div class="row"><div class="av" style="background:#34c759">阿</div><div class="meta"><div class="name"><b>阿明</b><span class="time">刚刚</span></div><div class="preview">晚上一起吃饭吗？</div></div></div>
      <div class="row"><div class="av" style="background:#007aff">小</div><div class="meta"><div class="name"><b>小雨</b><span class="time">10:21</span></div><div class="preview">文件我发你了，看一下</div></div></div>
      <div class="row"><div class="av" style="background:#ff9500">工</div><div class="meta"><div class="name"><b>工作群</b><span class="time">昨天</span></div><div class="preview">明天早上 10 点开会</div></div></div>
      <div class="row"><div class="av" style="background:#5856d6">家</div><div class="meta"><div class="name"><b>家人</b><span class="time">周日</span></div><div class="preview">周末回家吃饭吧</div></div></div>
      <div class="row"><div class="av" style="background:#ff2d55">快递</div><div class="meta"><div class="name"><b>快递助手</b><span class="time">周六</span></div><div class="preview">您的包裹已送达快递柜</div></div></div>
    </div>
  </div>
</div>
<script>
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
</script>
</body>
</html>
