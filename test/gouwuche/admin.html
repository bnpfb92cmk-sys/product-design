<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>购物车后台</title>
  <style>
    :root {
      --bg: #f0f3f7;
      --panel: #ffffff;
      --ink: #1a2332;
      --muted: #6b7a90;
      --line: #e2e8f0;
      --accent: #0d9488;
      --accent-soft: #ccfbf1;
      --warn: #d97706;
      --danger: #dc2626;
      --side: #132033;
      --side-text: #94a3b8;
      --radius: 10px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px 1fr;
    }

    aside {
      background: var(--side);
      color: #fff;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 0 8px;
    }
    .brand span { color: var(--accent); }
    nav { display: flex; flex-direction: column; gap: 4px; }
    nav a {
      color: var(--side-text);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.92rem;
    }
    nav a:hover { color: #fff; background: rgba(255,255,255,0.06); }
    nav a.active { color: #fff; background: rgba(13,148,136,0.25); }

    main { padding: 28px 32px 40px; }
    header.top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    header.top h1 { font-size: 1.4rem; font-weight: 650; }
    header.top p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .user {
      font-size: 0.88rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 8px 14px;
      border-radius: 999px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .stat .label { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
    .stat .value { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em; }
    .stat .delta { font-size: 0.78rem; margin-top: 6px; color: var(--accent); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { font-size: 1rem; font-weight: 600; }
    .btn {
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; background: #f8fafc; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }
    .tag.ok { background: var(--accent-soft); color: #0f766e; }
    .tag.wait { background: #fef3c7; color: #b45309; }
    .tag.fail { background: #fee2e2; color: #b91c1c; }

    .actions { display: flex; gap: 8px; }
    .actions button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .actions button:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 960px) {
      body { grid-template-columns: 1fr; }
      aside { flex-direction: row; align-items: center; padding: 16px; gap: 16px; }
      nav { flex-direction: row; flex-wrap: wrap; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      main { padding: 20px; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">购<span>物车</span>后台</div>
    <nav>
      <a class="active" href="#">概览</a>
      <a href="#">订单</a>
      <a href="#">商品</a>
      <a href="#">用户</a>
      <a href="#">设置</a>
    </nav>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1>运营概览</h1>
        <p>今日数据一览 · 2026-10-10</p>
      </div>
      <div class="user">管理员 · 海燕</div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="label">今日订单</div>
        <div class="value">128</div>
        <div class="delta">↑ 12% 较昨日</div>
      </div>
      <div class="stat">
        <div class="label">成交金额</div>
        <div class="value">¥36,420</div>
        <div class="delta">↑ 8% 较昨日</div>
      </div>
      <div class="stat">
        <div class="label">待发货</div>
        <div class="value">23</div>
        <div class="delta" style="color: var(--warn)">需尽快处理</div>
      </div>
      <div class="stat">
        <div class="label">活跃用户</div>
        <div class="value">1,056</div>
        <div class="delta">↑ 3% 较昨日</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>最近订单</h2>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" type="button" onclick="filterWait()">只看待发货</button>
          <button class="btn" type="button" onclick="resetFilter()">全部订单</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>订单号</th>
            <th>用户</th>
            <th>金额</th>
            <th>状态</th>
            <th>时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="orderBody"></tbody>
      </table>
    </section>
  </main>

  <script>
    const orders = [
      { id: "GC20261010001", user: "张三", amount: "¥268.00", status: "ok", statusText: "已完成", time: "14:32" },
      { id: "GC20261010002", user: "李四", amount: "¥89.90", status: "wait", statusText: "待发货", time: "14:18" },
      { id: "GC20261010003", user: "王五", amount: "¥1,299.00", status: "wait", statusText: "待发货", time: "13:55" },
      { id: "GC20261010004", user: "赵六", amount: "¥45.00", status: "fail", statusText: "已取消", time: "13:20" },
      { id: "GC20261010005", user: "钱七", amount: "¥532.50", status: "ok", statusText: "已完成", time: "12:48" },
      { id: "GC20261010006", user: "孙八", amount: "¥159.00", status: "wait", statusText: "待发货", time: "11:06" },
    ];

    let showWaitOnly = false;

    function render() {
      const list = showWaitOnly ? orders.filter(o => o.status === "wait") : orders;
      const tbody = document.getElementById("orderBody");
      tbody.innerHTML = list.map(o => `
        <tr data-status="${o.status}">
          <td>${o.id}</td>
          <td>${o.user}</td>
          <td>${o.amount}</td>
          <td><span class="tag ${o.status}">${o.statusText}</span></td>
          <td>${o.time}</td>
          <td class="actions">
            <button type="button" onclick="alert('查看 ${o.id}')">查看</button>
            ${o.status === "wait" ? `<button type="button" onclick="alert('已标记发货：${o.id}')">发货</button>` : ""}
          </td>
        </tr>
      `).join("");
    }

    function filterWait() { showWaitOnly = true; render(); }
    function resetFilter() { showWaitOnly = false; render(); }

    render();
  </script>
</body>
</html>
